<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="line-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="line-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg-grad)" rx="16"/>

  <!-- Dynamic / Animated Flow Graphic Background Elements (behind text) -->
  <g opacity="0.35">
    <!-- Animated Path 1 -->
    <path d="M -100 200 C 300 50, 500 280, 1300 100" fill="none" stroke="url(#line-grad-1)" stroke-width="4">
      <animate attributeName="d" 
               values="M -100 200 C 300 50, 500 280, 1300 100;
                       M -100 150 C 400 260, 600 40, 1300 220;
                       M -100 200 C 300 50, 500 280, 1300 100" 
               dur="12s" repeatCount="indefinite" />
    </path>
    
    <!-- Animated Path 2 -->
    <path d="M -100 80 C 400 280, 700 20, 1300 200" fill="none" stroke="url(#line-grad-2)" stroke-width="3" stroke-dasharray="8 6">
      <animate attributeName="d" 
               values="M -100 80 C 400 280, 700 20, 1300 200;
                       M -100 220 C 300 20, 800 250, 1300 90;
                       M -100 80 C 400 280, 700 20, 1300 200" 
               dur="16s" repeatCount="indefinite" />
    </path>

    <!-- Flow Pulses / Moving Nodes (background only) -->
    <circle r="6" fill="#38bdf8" filter="url(#glow)">
      <animateMotion path="M -100 200 C 300 50, 500 280, 1300 100" dur="6s" repeatCount="indefinite" />
    </circle>
    
    <circle r="5" fill="#c084fc" filter="url(#glow)">
      <animateMotion path="M -100 80 C 400 280, 700 20, 1300 200" dur="9s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Foreground Title and Subtitle -->
  <g transform="translate(600, 135)" text-anchor="middle">
    <!-- Main Title -->
    <text x="0" y="0" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="46" 
          font-weight="900" 
          fill="url(#text-grad)" 
          letter-spacing="1">Awesome Serverless Event Routing</text>
    
    <!-- Subtitle -->
    <text x="0" y="45" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="18" 
          font-weight="400" 
          fill="#94a3b8" 
          letter-spacing="0.5">Top Ecosystem of Event-Driven Platforms, Webhook Gateways &amp; Open-Source Infrastructure</text>

    <!-- Pills / Category Badges (Clean Foreground Layout) -->
    <g transform="translate(0, 85)">
      <!-- Pill 1 -->
      <g transform="translate(-240, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="0" y="4" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">Event-Driven</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-80, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
        <text x="0" y="4" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#818cf8" text-anchor="middle">Webhooks</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(80, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
        <text x="0" y="4" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#c084fc" text-anchor="middle">CloudEvents</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(240, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
        <text x="0" y="4" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#f43f5e" text-anchor="middle">Serverless</text>
      </g>
    </g>
  </g>
</svg>
